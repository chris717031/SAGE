<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>威策電腦 - 小威 IT 智慧報修助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-bottom { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    
    /* 聊天室對話背景：Welltake 浮水印底圖 */
    .chat-bg {
      background-color: #f8fafc;
      background-image: url('Welltake.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;
      background-attachment: local;
    }

    /* 註冊頁面專屬背景：以 Welltake.png 作為全螢幕背景底圖 */
    .register-bg-layer {
      background-color: #0c122c;
      background-image: url('Welltake.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
    }

    /* 氣泡微透明磨砂效果 */
    .bubble-ai {
      background-color: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
    }
    .bubble-user {
      background-color: #1e293b;
      color: #ffffff;
    }

    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-listening {
      animation: micPulse 1.4s infinite ease-out;
      background-color: #ef4444 !important;
      color: white !important;
    }
  </style>
</head>

      <div class="flex items-center space-x-3 mb-4 border-b border-slate-200 pb-3">
        <img src="Welltake_Logo_light.png" alt="威策電腦 Logo" class="h-9 w-auto object-contain">
        <div>
          <h2 class="text-sm font-bold text-slate-900 leading-tight">IT 智慧報修小助手</h2>

        </div>
      </div>
