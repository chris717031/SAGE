<script>
  let knowledgeBase = [];
  let currentMatchedSOP = null;
  let recognition = null;
  let isListening = false;

  // 1. 初始化語音辨識 (STT) - 兼顧 Webkit 與標準語法
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function initSpeechRecognition() {
    if (!SpeechRecognition) {
      console.warn("此手機瀏覽器環境不支援 Web Speech API 語音辨識");
      return;
    }
    try {
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.continuous = false; // 手機端建議設為 false，單次辨識較穩定
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        updateMicStatus(true);
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text) {
          document.getElementById('userMsgInput').value = text;
          handleUserSend();
        }
      };

      recognition.onerror = (e) => {
        console.warn("麥克風收音失敗或中斷:", e.error);
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
      };
    } catch (err) {
      console.error("STT 初始化錯誤:", err);
    }
  }

  function startListening() {
    if (!recognition) {
      alert("目前的手機瀏覽器限制了網頁麥克風辨識。iPhone 請務必使用 Safari 開啟；若仍無法使用，可直接打字或點擊下方快捷選項！");
      return;
    }
    try {
      recognition.start();
    } catch (e) {
      // 避免重複啟動報錯
    }
  }

  function stopListening() {
    isListening = false;
    updateMicStatus(false);
    if (recognition) {
      try { recognition.stop(); } catch(e){}
    }
  }

  function toggleListening() {
    if (isListening) {
      stopListening();
    } else {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      startListening();
    }
  }

  function updateMicStatus(active) {
    const micBtn = document.getElementById('micBtn');
    if (!micBtn) return;
    if (active) {
      micBtn.classList.add('bg-rose-500', 'text-white', 'animate-pulse');
      micBtn.classList.remove('bg-slate-100', 'text-slate-600');
    } else {
      micBtn.classList.remove('bg-rose-500', 'text-white', 'animate-pulse');
      micBtn.classList.add('bg-slate-100', 'text-slate-600');
    }
  }

  // 2. 語音合成朗讀 (TTS)
  function speak(text, onComplete = null) {
    if (!('speechSynthesis' in window)) {
      if (onComplete) onComplete();
      return;
    }

    window.speechSynthesis.cancel();
    const cleanText = text.replace(/<[^>]*>/g, '').replace(/📷|💻|💡|✅|❌|📋|⚠️/g, '');
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'zh-TW';
    utterance.rate = 1.05;

    utterance.onend = () => {
      if (onComplete) onComplete();
    };
    utterance.onerror = () => {
      if (onComplete) onComplete();
    };

    window.speechSynthesis.speak(utterance);
  }

  // 3. 載入知識庫
  async function loadKB() {
    try {
      const res = await fetch('kb.json');
      knowledgeBase = await res.json();
    } catch (e) {
      console.error("知識庫載入失敗:", e);
    }
  }

  // 4. 使用者點擊進入（在主線程事件中同時解鎖 TTS 與 STT）
  function startApp() {
    document.getElementById('welcomeSplash').style.display = 'none';
    
    // 初始化 STT
    initSpeechRecognition();
    loadKB();

    const hello = "我在！我是小威，請問今天電腦遇到什麼問題呢？請直接說給我聽！";
    appendChat('ai', hello);

    // 關鍵：在使用者點擊按鈕的當下立即發聲解鎖音訊
    speak(hello, () => {
      // 朗讀完畢後嘗試自動聆聽
      startListening();
    });
  }

  function appendChat(role, text, buttons = null, ticket = null) {
    const area = document.getElementById('chatArea');
    const box = document.createElement('div');
    if (role === 'user') {
      box.className = "flex justify-end";
      box.innerHTML = `<div class="bg-sky-600 text-white text-sm rounded-2xl rounded-tr-sm p-3 max-w-[85%] leading-relaxed">${text}</div>`;
    } else {
      box.className = "flex space-x-2 items-start";
      let btnHtml = '';
      if (buttons) {
        btnHtml = `
          <div class="mt-2.5 pt-2 border-t border-slate-100 flex space-x-2">
            <button onclick="handleResult(true)" class="flex-1 py-1.5 bg-emerald-600 active:bg-emerald-700 text-white text-xs font-bold rounded">✅ 已解決</button>
            <button onclick="handleResult(false)" class="flex-1 py-1.5 bg-rose-600 active:bg-rose-700 text-white text-xs font-bold rounded">❌ 仍無法解決</button>
          </div>
        `;
      }
      let ticketHtml = '';
      if (ticket) {
        ticketHtml = `
          <div class="mt-2.5 p-2 bg-slate-50 border border-slate-200 rounded text-xs space-y-1">
            <div class="font-bold text-rose-600">🚨 報修工單已自動建立</div>
            <div><b>工單編號：</b>${ticket.id}</div>
            <div><b>指派組別：</b>${ticket.dept}</div>
            <div><b>故障摘要：</b>${ticket.symptom}</div>
            <div class="text-[11px] text-slate-500">已自動推播通知外派工程師。</div>
          </div>
        `;
      }
      box.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-sky-600 text-white flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">威</div>
        <div class="bg-white border border-slate-200 text-slate-800 text-sm rounded-2xl rounded-tl-sm p-3 max-w-[85%] shadow-sm leading-relaxed">
          ${text}${btnHtml}${ticketHtml}
        </div>
      `;
    }
    area.appendChild(box);
    area.scrollTop = area.scrollHeight;
  }

  function handleUserSend() {
    const input = document.getElementById('userMsgInput');
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    appendChat('user', q);

    const matched = knowledgeBase.find(item => 
      item.keywords.some(k => q.toLowerCase().includes(k.toLowerCase()))
    );

    setTimeout(() => {
      if (!matched) {
        const noMatchMsg = "抱歉，在目前 SOP 庫中找不到完全相符的指引。為了避免誤判，小威已直接為您建立派修單！";
        appendChat('ai', noMatchMsg, false, {
          id: "TCK-" + Date.now().toString().slice(-4),
          dept: "一般維護工程師",
          symptom: q
        });
        speak("找不到相符的指引，已直接為您安排工程師！");
        return;
      }

      currentMatchedSOP = matched;

      if (!matched.allow_self_resolve) {
        appendChat('ai', matched.safe_steps, false, {
          id: "TCK-" + Date.now().toString().slice(-4),
          dept: matched.escalate_dept,
          symptom: matched.symptom
        });
        speak(matched.safe_steps);
        return;
      }

      let imgHtml = '';
      if (matched.image_url) {
        imgHtml = `<div class="mt-2 rounded overflow-hidden border"><img src="${matched.image_url}" class="w-full max-h-40 object-cover"></div>`;
      }

      const guideMsg = `小威為您找到【${matched.symptom}】的排除步驟：<br><br>${matched.safe_steps}${imgHtml}<br><br>請問執行後問題是否已解決？`;
      appendChat('ai', guideMsg, true);
      speak(`小威為您找到排除指引：${matched.safe_steps}。請問是否解決？`);
    }, 400);
  }

  function handleResult(resolved) {
    if (resolved) {
      const msg = "太好了！很高興能幫上忙，本次案件已歸檔為自主排除，祝您工作順利！";
      appendChat('user', "✅ 已經解決了，謝謝！");
      appendChat('ai', msg);
      speak(msg);
    } else {
      const msg = "收到，已確認排除無效。小威已為您建立派工單，工程師將儘速前往處理！";
      appendChat('user', "❌ 嘗試過還是無法解決，請派工程師！");
      appendChat('ai', msg, false, {
        id: "TCK-" + Date.now().toString().slice(-4),
        dept: currentMatchedSOP ? currentMatchedSOP.escalate_dept : "硬體維護組",
        symptom: currentMatchedSOP ? currentMatchedSOP.symptom : "使用者排除未果"
      });
      speak(msg);
    }
  }

  // 綁定輸入列麥克風按鈕
  document.addEventListener('DOMContentLoaded', () => {
    const micBtn = document.getElementById('micBtn');
    if (micBtn) {
      micBtn.addEventListener('click', toggleListening);
    }
  });

  document.getElementById('userMsgInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleUserSend();
  });
</script>
